name: nocknock
description: "NockNock collaborative post-it reminders and tasks."
publish_to: "none"

version: 1.0.0+523

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dio: ^5.11.1
  html: ^0.15.7
  socket_io_client: ^3.1.6
  web_socket: ^1.0.1
  uuid: ^4.6.0
  intl: ^0.20.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  google_sign_in: ^7.2.0
  in_app_update: ^5.0.0
  shared_preferences: ^2.5.6
  flutter_quill: ^11.6.0
  flutter_staggered_grid_view: ^0.7.0
  image: ^4.10.1
  image_picker: ^1.2.4
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^10.3.4
  local_auth: ^3.0.2
  sqflite: ^2.4.4+1
  file_selector: ^1.1.0
  file_saver: ^0.4.0
  pdfrx: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/nocknock-logo.png
    - assets/note_backgrounds/
