name: Publicar Android en pruebas internas

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nocknock-google-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-internal:
    name: Validar, firmar y publicar AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Resolver dependencias
        run: flutter pub get

      - name: Analizar codigo
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

      - name: Preparar version de Play
        shell: bash
        run: |
          set -euo pipefail

          build_name="$(awk '/^version:/ { print $2 }' pubspec.yaml | cut -d+ -f1)"
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))

          if [[ ! "$build_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "La version de pubspec.yaml no es valida: $build_name" >&2
            exit 1
          fi

          if ((build_number > 2100000000)); then
            echo "El versionCode calculado supera el limite de Google Play." >&2
            exit 1
          fi

          echo "BUILD_NAME=$build_name" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Restaurar firma Android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          set +x

          missing=()
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("$secret_name")
            fi
          done

          if ((${#missing[@]} > 0)); then
            printf 'Faltan secretos de GitHub Actions: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/nocknock-upload.jks

          {
            printf 'storeFile=app/nocknock-upload.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

          chmod 600 android/app/nocknock-upload.jks android/key.properties

      - name: Generar Android App Bundle
        run: >-
          flutter build appbundle --release
          --build-name "$BUILD_NAME"
          --build-number "$BUILD_NUMBER"

      - name: Verificar firma del AAB
        run: jarsigner -verify build/app/outputs/bundle/release/app-release.aab

      - name: Guardar AAB del pipeline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nocknock-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publicar en pruebas internas de Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cl.nocknock.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: NockNock ${{ env.BUILD_NAME }} (${{ env.BUILD_NUMBER }})
