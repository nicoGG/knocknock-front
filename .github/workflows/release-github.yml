name: Crear GitHub Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit o tag a compilar; vacio usa la rama seleccionada'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nocknock-github-release
  cancel-in-progress: false

jobs:
  release:
    name: Validar, firmar y crear release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Descargar herramientas del workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Probar logica de releases
        run: python3 -m unittest discover -s .release-tools/.github/scripts/tests -v

      - name: Comprobar version, commit y archivos existentes
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-tools/.github/scripts/github_release.py check

      - name: Configurar Java
        if: steps.release_state.outputs.needs_build == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Flutter
        if: steps.release_state.outputs.needs_build == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Resolver dependencias
        if: steps.release_state.outputs.needs_build == 'true'
        run: flutter pub get

      - name: Analizar codigo
        if: steps.release_state.outputs.needs_build == 'true'
        run: flutter analyze

      - name: Ejecutar pruebas
        if: steps.release_state.outputs.needs_build == 'true'
        run: flutter test

      - name: Restaurar firma Android
        if: steps.release_state.outputs.needs_build == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          missing=()
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("$secret_name")
            fi
          done

          if ((${#missing[@]} > 0)); then
            printf 'Faltan secretos de GitHub Actions: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/nocknock-upload.jks

          {
            printf 'storeFile=app/nocknock-upload.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

          chmod 600 android/app/nocknock-upload.jks android/key.properties

      - name: Generar APK firmado
        if: steps.release_state.outputs.needs_build == 'true'
        env:
          GOOGLE_PLAY_BILLING_ENABLED: ${{ vars.GOOGLE_PLAY_BILLING_ENABLED || 'false' }}
        run: >-
          flutter build apk --release
          --dart-define="GOOGLE_PLAY_BILLING_ENABLED=$GOOGLE_PLAY_BILLING_ENABLED"
          --build-name "$BUILD_NAME"
          --build-number "$BUILD_NUMBER"

      - name: Verificar y preparar APK
        if: steps.release_state.outputs.needs_build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          jarsigner -verify build/app/outputs/flutter-apk/app-release.apk
          mv build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          shasum -a 256 "$APK_NAME" > "${APK_NAME}.sha256"

      - name: Guardar APK del pipeline
        if: steps.release_state.outputs.needs_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nocknock-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Completar GitHub Release
        if: steps.release_state.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-tools/.github/scripts/github_release.py publish
